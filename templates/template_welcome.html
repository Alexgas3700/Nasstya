<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .content {
            padding: 30px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
        .footer {
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Добро пожаловать, {{firstName}}!</h1>
        </div>
        <div class="content">
            <p>Здравствуйте, {{firstName}} {{lastName}}!</p>
            <p>Спасибо за регистрацию в нашей системе. Мы рады видеть вас среди наших пользователей.</p>
            <center>
                <a href="https://example.com/get-started" class="button">Начать работу</a>
            </center>
            <p>Если у вас возникнут вопросы, наша команда поддержки всегда готова помочь.</p>
        </div>
        <div class="footer">
            <p><a href="{{unsubscribeLink}}">Отписаться</a> | © 2026 Email Campaign System</p>
        </div>
    </div>
</body>
</html>
